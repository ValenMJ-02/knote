# En Kubernetes/Docker se sobreescribe con la variable de entorno MONGO_URL
spring.data.mongodb.uri=${MONGO_URL:mongodb://localhost:27017/dev}

# El tutorial usa index.ftl
spring.freemarker.suffix=.ftl

# Por defecto Spring limita los archivos a 1MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info
